<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RC Car</title>
<style>
  :root { --bg:#10131a; --accent:#4cc2ff; --stop:#ff4d5e; --ok:#36d399; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#e8edf5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; }
  header h1 { font-size:18px; margin:0; font-weight:650; letter-spacing:.3px; }
  #status { margin-left:auto; font-size:13px; padding:5px 12px; border-radius:999px; background:#2a3145; transition:.2s; }
  #status.on  { background:rgba(54,211,153,.18); color:var(--ok); }
  #status.off { background:rgba(255,77,94,.18); color:var(--stop); }
  main { flex:1; display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px; padding:0 16px; position:relative; }
  #cam-wrap { aspect-ratio:4/3; height:min(44vh,320px); background:#0a0d14; border-radius:14px; overflow:hidden; border:2px solid #2e3650; flex-shrink:0; }
  #cam-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  #pad { width:min(44vh,320px); height:min(44vh,320px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #232a3d, #161b28);
    box-shadow:inset 0 0 0 2px #2e3650, 0 10px 30px rgba(0,0,0,.4); position:relative; touch-action:none; }
  #pad::before, #pad::after { content:""; position:absolute; background:#2e3650; }
  #pad::before { left:8%; right:8%; top:50%; height:2px; transform:translateY(-50%); }
  #pad::after  { top:8%; bottom:8%; left:50%; width:2px; transform:translateX(-50%); }
  #knob { position:absolute; width:34%; height:34%; left:33%; top:33%; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #6fd0ff, var(--accent));
    box-shadow:0 6px 18px rgba(0,0,0,.5); transition:transform .05s linear; }
  footer { padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .row { display:flex; gap:12px; align-items:center; }
  .meters { display:flex; gap:18px; font-variant-numeric:tabular-nums; font-size:14px; color:#9fb0c8; }
  .meters b { color:#e8edf5; }
  #stop { margin-left:auto; border:0; border-radius:14px; padding:16px 26px; font-size:17px;
    font-weight:700; color:#fff; background:var(--stop); box-shadow:0 6px 18px rgba(255,77,94,.4); }
  #stop:active { transform:translateY(1px); }
  .hint { margin-top:10px; font-size:12px; color:#6c7891; text-align:center; }
</style>
</head>
<body>
  <header><h1>🚗 RC Car</h1><span id="status" class="off">connecting…</span></header>
  <main>
    <div id="cam-wrap"><img id="cam" alt="Camera feed"></div>
    <div id="pad"><div id="knob"></div></div>
  </main>
  <footer>
    <div class="row">
      <div class="meters">
        <span>throttle <b id="mThrottle">0%</b></span>
        <span>steer <b id="mSteer">0%</b></span>
      </div>
      <button id="stop">STOP</button>
    </div>
    <div class="hint">Drag the joystick. Release to stop. Keep wheels off the ground for your first test.</div>
  </footer>
<script>
(() => {
  "use strict";
  // Same-origin when served by the ESP32; fall back to the AP IP for desktop preview.
  const BASE = (location.protocol === "http:" || location.protocol === "https:") ? "" : "http://192.168.4.1";
  const DEADZONE = 0.08, RATE_MS = 80;
  const statusEl=document.getElementById("status"), pad=document.getElementById("pad"),
        knob=document.getElementById("knob"), mT=document.getElementById("mThrottle"),
        mS=document.getElementById("mSteer"), stopBtn=document.getElementById("stop");
  let steer=0, throttle=0, dragging=false, inflight=false, idleTick=0;
  function setStatus(t,c){statusEl.textContent=t;statusEl.className=c;}
  function ok(){ setStatus("connected","on"); } function bad(){ setStatus("disconnected","off"); }
  // Guarded sender for the rapid control stream (skips if one is still in flight).
  function send(path){ if(inflight) return; inflight=true;
    fetch(BASE+path,{cache:"no-store"}).then(r=>{ if(r.ok) ok(); else bad(); })
      .catch(bad).finally(()=>{ inflight=false; }); }
  // Stop must ALWAYS go through, even if a control request is in flight.
  function stopNow(){ fetch(BASE+"/s",{cache:"no-store"}).then(r=>{ if(r.ok) ok(); }).catch(bad); }
  setInterval(()=>{
    const active = Math.abs(throttle)>1e-3 || Math.abs(steer)>1e-3;
    if(active){ send(`/c?s=${steer.toFixed(3)}&t=${throttle.toFixed(3)}`); }
    else if((idleTick++ % 12)===0){ send("/c?s=0&t=0"); }   // ~1s heartbeat keeps status fresh
  }, RATE_MS);
  const dz=v=>Math.abs(v)<DEADZONE?0:v;
  function setInput(nx,ny){ const mag=Math.hypot(nx,ny); if(mag>1){nx/=mag;ny/=mag;}
    steer=dz(nx); throttle=dz(ny); knob.style.transform=`translate(${nx*100}%, ${-ny*100}%)`;
    mT.textContent=Math.round(throttle*100)+"%"; mS.textContent=Math.round(steer*100)+"%"; }
  function center(){ steer=throttle=0; knob.style.transform="translate(0,0)";
    mT.textContent="0%"; mS.textContent="0%"; stopNow(); }
  function p2i(x,y){ const r=pad.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, rad=r.width/2;
    setInput((x-cx)/rad, -(y-cy)/rad); }
  const rel=()=>{if(dragging){dragging=false;center();}};
  // Touch events — work on ALL iOS versions (Pointer Events do not on older iOS).
  pad.addEventListener("touchstart",e=>{e.preventDefault();dragging=true;const t=e.changedTouches[0];p2i(t.clientX,t.clientY);},{passive:false});
  pad.addEventListener("touchmove", e=>{e.preventDefault();if(dragging){const t=e.changedTouches[0];p2i(t.clientX,t.clientY);}},{passive:false});
  pad.addEventListener("touchend",  e=>{e.preventDefault();rel();},{passive:false});
  pad.addEventListener("touchcancel",rel,{passive:false});
  // Mouse events — desktop browser preview.
  let md=false;
  pad.addEventListener("mousedown",e=>{md=true;dragging=true;p2i(e.clientX,e.clientY);});
  window.addEventListener("mousemove",e=>{if(md)p2i(e.clientX,e.clientY);});
  window.addEventListener("mouseup",()=>{if(md){md=false;rel();}});
  stopBtn.addEventListener("click",center);
  window.addEventListener("blur",center);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)center();});
  let camBusy = false;
  const camEl = document.getElementById("cam");
  setInterval(() => {
    if (camBusy) return;
    camBusy = true;
    const t = new Image();
    t.onload = () => { camEl.src = t.src; camBusy = false; };
    t.onerror = () => { camBusy = false; };
    t.src = BASE + "/cam?t=" + Date.now();
  }, 150);
  stopNow();
})();
</script>
</body>
</html>
